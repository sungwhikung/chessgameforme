<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chess Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <div class="chess-main">
        <div class="board-wrapper">
            <div id="myBoard" style="width: 100%"></div>
        </div>

        <aside class="side-panel">
            <div class="info-box"><h2 id="status">로딩 중...</h2></div>
            <div class="control-box">
                <select id="difficulty">
                    <option value="3">초보</option>
                    <option value="10" selected>중급</option>
                    <option value="15">상급</option>
                </select>
                <button id="resetBtn">새 게임</button>
                <button id="undoBtn">무르기</button>
            </div>
            <div id="pgn-log"></div>
        </aside>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="script.js?v=2"></script>
</body>
</html>
