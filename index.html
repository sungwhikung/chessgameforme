<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-End AI Chess</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <div class="chess-main">
        <div class="board-wrapper">
            <div id="myBoard"></div>
        </div>

        <aside class="side-panel">
            <div class="info-box">
                <h2 id="status">대국 준비 중...</h2>
            </div>

            <div class="control-box">
                <label><i class="fas fa-brain"></i> AI 수준 설정</label>
                <select id="difficulty">
                    <option value="3">초보자 (Depth 3)</option>
                    <option value="10" selected>중급자 (Depth 10)</option>
                    <option value="15">상급자 (Depth 15)</option>
                </select>
                
                <div class="btn-group">
                    <button id="resetBtn" class="btn-main"><i class="fas fa-redo"></i> 새 게임</button>
                    <button id="undoBtn" class="btn-sub"><i class="fas fa-undo-alt"></i> 무르기</button>
                </div>
            </div>

            <div class="history-box">
                <h3><i class="fas fa-history"></i> 기보 기록</h3>
                <div id="pgn-log"></div>
            </div>
        </aside>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="script.js"></script>
</body>
</html>
